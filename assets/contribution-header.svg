<svg
  width="900"
  height="150"
  viewBox="0 0 900 150"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="150">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="border" x1="0" y1="0" x2="900" y2="0">

      <stop offset="0%" stop-color="#30363D"/>

      <stop offset="50%" stop-color="#58A6FF">
        <animate
          attributeName="stop-color"
          values="#58A6FF;#A371F7;#58A6FF"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#30363D"/>

    </linearGradient>

    <!-- Glow -->
    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

  </defs>


  <!-- Card -->

  <rect
    x="2"
    y="2"
    width="896"
    height="146"
    rx="18"
    fill="url(#bg)"
    stroke="url(#border)"
    stroke-width="2"
  />


  <!-- Ambient glow -->

  <ellipse
    cx="450"
    cy="70"
    rx="320"
    ry="100"
    fill="url(#blueGlow)"
  />


  <!-- Small terminal indicator -->

  <circle
    cx="42"
    cy="35"
    r="5"
    fill="#3FB950"
  >
    <animate
      attributeName="opacity"
      values="1;0.4;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>


  <text
    x="58"
    y="39"
    fill="#8B949E"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
    font-weight="500"
  >
    github.activity
  </text>


  <!-- Main heading -->

  <text
    x="450"
    y="78"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Poppins, Arial, sans-serif"
    font-size="27"
    font-weight="700"
  >
    Contribution Activity
  </text>


  <!-- Accent line -->

  <rect
    x="370"
    y="91"
    width="160"
    height="2"
    rx="1"
    fill="#58A6FF"
  >

    <animate
      attributeName="width"
      values="100;180;100"
      dur="4s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="x"
      values="400;360;400"
      dur="4s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- Subtitle -->

  <text
    x="450"
    y="119"
    text-anchor="middle"
    fill="#8B949E"
    font-family="Poppins, Arial, sans-serif"
    font-size="13"
    font-weight="400"
  >
    Consistency · Open Source · Building in Public
  </text>


  <!-- Right decorative code -->

  <text
    x="820"
    y="39"
    text-anchor="middle"
    fill="#58A6FF"
    font-family="monospace"
    font-size="13"
  >
    &lt;/&gt;
  </text>

</svg>
