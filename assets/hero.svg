<svg width="900" height="280" viewBox="0 0 900 280"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color"
                 values="#58a6ff;#a371f7;#58a6ff"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#a371f7">
        <animate attributeName="stop-color"
                 values="#a371f7;#58a6ff;#a371f7"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect
    x="2"
    y="2"
    width="896"
    height="276"
    rx="16"
    fill="#0d1117"
    stroke="url(#border)"
    stroke-width="2"
  />

  <text
    x="45"
    y="65"
    fill="#8b949e"
    font-family="monospace"
    font-size="18">
    tanmay@github:~$
  </text>

  <text
    x="45"
    y="115"
    fill="#ffffff"
    font-family="monospace"
    font-size="36"
    font-weight="bold">
    Tanmay Sharma
  </text>

  <text
    x="45"
    y="155"
    fill="#58a6ff"
    font-family="monospace"
    font-size="21">
    Full-Stack Developer &amp; Product Builder
  </text>

  <text
    x="45"
    y="195"
    fill="#8b949e"
    font-family="monospace"
    font-size="16">
    React · Next.js · Node.js · TypeScript
  </text>

  <text
    x="45"
    y="230"
    fill="#8b949e"
