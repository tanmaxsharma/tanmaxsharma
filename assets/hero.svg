<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>

    <linearGradient id="heroBg" x1="0" y1="0" x2="900" y2="300">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#A371F7;#58A6FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A371F7">
        <animate attributeName="stop-color" values="#A371F7;#58A6FF;#A371F7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#A371F7;#58A6FF" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <clipPath id="nameClip">
      <rect x="42" y="88" width="0" height="46">
        <animate attributeName="width" from="0" to="420" dur="1.7s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="roleClip">
      <rect x="42" y="148" width="0" height="30">
        <animate attributeName="width" from="0" to="480" dur="1.6s" begin="2.4s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="stackClip">
      <rect x="42" y="184" width="0" height="26">
        <animate attributeName="width" from="0" to="400" dur="1.3s" begin="4.2s" fill="freeze"/>
      </rect>
    </clipPath>

    <linearGradient id="descriptionGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B949E"/>
      <stop offset="100%" stop-color="#C9D1D9"/>
    </linearGradient>

  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="896" height="296" rx="18" fill="url(#heroBg)" stroke="url(#heroBorder)" stroke-width="2"/>

  <!-- Header bar -->
  <path d="M2 46H898" stroke="#21262D" stroke-width="1"/>

  <circle cx="35" cy="23" r="5" fill="#FF5F56"/>
  <circle cx="52" cy="23" r="5" fill="#FFBD2E"/>
  <circle cx="69" cy="23" r="5" fill="#27C93F"/>

  <text x="95" y="28" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="500">tanmay@github</text>
  <text x="200" y="28" fill="#58A6FF" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">~</text>
  <text x="213" y="28" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="500">$</text>

  <!-- Status indicator -->
  <text x="778" y="28" text-anchor="end" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="11" letter-spacing="0.5">AVAILABLE</text>
  <circle cx="855" cy="23" r="5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Command prompt -->
  <text x="42" y="74" font-family="Poppins, Arial, sans-serif" font-size="14">
    <tspan fill="#58A6FF" font-weight="600">$</tspan>
    <tspan fill="#8B949E" font-weight="500"> whoami</tspan>
  </text>

  <!-- Name -->
  <g clip-path="url(#nameClip)">
    <text x="42" y="122" fill="#FFFFFF" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">Tanmay Sharma</text>
  </g>
  <rect x="42" y="90" width="3" height="40" rx="1" fill="#58A6FF">
    <animate attributeName="x" from="42" to="345" dur="1.7s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
  </rect>

  <!-- Role -->
  <g clip-path="url(#roleClip)">
    <text x="42" y="169" fill="#58A6FF" font-family="Poppins, Arial, sans-serif" font-size="21" font-weight="600">Full-Stack Developer &amp; Product Builder</text>
  </g>

  <!-- Tech stack -->
  <g clip-path="url(#stackClip)">
    <text x="42" y="202" fill="#C9D1D9" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="500">React · Next.js · Node.js · TypeScript</text>
  </g>

  <!-- Positioning statement -->
  <text x="42" y="234" fill="url(#descriptionGradient)" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="400" opacity="0">
    Building practical, production-grade software.
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="5.6s" fill="freeze"/>
  </text>

  <!-- Idle prompt -->
  <text x="42" y="272" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="500" opacity="0">
    $
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.2s" fill="freeze"/>
  </text>
  <rect x="58" y="260" width="8" height="15" fill="#58A6FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.88;1" dur="0.7s" begin="6.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="6.6s" repeatCount="indefinite"/>
  </rect>

</svg>
