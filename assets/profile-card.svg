    Available for interesting projects
  </text>


  <!-- GitHub username -->

  <text
    x="730"
    y="249"
    fill="#58A6FF"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
    font-weight="600"
  >
    @tanmaxsharma
  </text>

</svg>
