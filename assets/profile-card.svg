    building:
  </text>

  <text
    x="700"
    y="151"
    fill="#7EE787"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
  >
    "products"
  </text>

  <text
    x="636"
    y="175"
    fill="#8B949E"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
  >
    learning:
  </text>

  <text
    x="700"
    y="175"
    fill="#7EE787"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
  >
    "always"
  </text>

  <text
    x="620"
    y="199"
    fill="#79C0FF"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
  >
    }
  </text>


  <!-- Bottom status -->

  <circle
    cx="42"
    cy="245"
    r="5"
    fill="#3FB950"
    filter="url(#statusGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="56"
    y="249"
    fill="#8B949E"
    font-family="Poppins, Arial, sans-serif"
    font-size="12"
