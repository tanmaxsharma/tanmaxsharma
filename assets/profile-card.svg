<svg
  width="900"
  height="280"
  viewBox="0 0 900 280"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>

    <linearGradient id="cardBg" x1="0" y1="0" x2="900" y2="280">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#A371F7;#58A6FF" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="2"/>

  <ellipse cx="760" cy="100" rx="220" ry="180" fill="url(#cardGlow)"/>

  <!-- Header -->
  <rect x="2" y="2" width="896" height="48" rx="18" fill="#161B22"/>
  <path d="M2 50H898" stroke="#30363D" stroke-width="1"/>

  <circle cx="28" cy="25" r="5" fill="#FF5F56"/>
  <circle cx="45" cy="25" r="5" fill="#FFBD2E"/>
  <circle cx="62" cy="25" r="5" fill="#27C93F"/>

  <text x="82" y="30" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="500">tanmay@github:~</text>
  <text x="862" y="30" text-anchor="end" fill="#58A6FF" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="500">./profile</text>

  <!-- Left column -->
  <text x="38" y="84" fill="#58A6FF" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">developer.profile</text>
  <text x="38" y="112" fill="#FFFFFF" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700">Tanmay Sharma</text>
  <text x="38" y="137" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="500">Full-Stack Developer &amp; Product Builder</text>

  <path d="M38 154H562" stroke="#30363D" stroke-width="1"/>

  <text x="38" y="181" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="11" letter-spacing="0.5">FOCUS</text>
  <text x="38" y="204" fill="#C9D1D9" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600">Product Engineering</text>

  <text x="250" y="181" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="11" letter-spacing="0.5">STACK</text>
  <text x="250" y="204" fill="#C9D1D9" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600">React · Next · Node</text>

  <text x="440" y="181" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="11" letter-spacing="0.5">LOCATION</text>
  <text x="440" y="204" fill="#C9D1D9" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600">India</text>

  <!-- Right column: code block -->
  <rect x="600" y="77" width="260" height="145" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <text x="620" y="103" font-family="Poppins, Arial, sans-serif" font-size="12">
    <tspan fill="#8B949E">const</tspan>
    <tspan fill="#A371F7" dx="6">developer</tspan>
    <tspan fill="#8B949E" dx="6">=</tspan>
  </text>

  <text x="620" y="127" fill="#79C0FF" font-family="Poppins, Arial, sans-serif" font-size="12">{</text>

  <text x="636" y="151" font-family="Poppins, Arial, sans-serif" font-size="12">
    <tspan fill="#8B949E">building:</tspan>
    <tspan fill="#7EE787" dx="6">"products"</tspan>
  </text>

  <text x="636" y="175" font-family="Poppins, Arial, sans-serif" font-size="12">
    <tspan fill="#8B949E">learning:</tspan>
    <tspan fill="#7EE787" dx="6">"always"</tspan>
  </text>

  <text x="620" y="199" fill="#79C0FF" font-family="Poppins, Arial, sans-serif" font-size="12">}</text>

  <!-- Bottom status row -->
  <circle cx="42" cy="245" r="7" fill="#3FB950" opacity="0.18"/>
  <circle cx="42" cy="245" r="5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="249" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="12">Available for interesting projects</text>

  <text x="730" y="230" fill="#8B949E" font-family="Poppins, Arial, sans-serif" font-size="11" letter-spacing="0.5">GITHUB</text>
  <text x="730" y="249" fill="#58A6FF" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">@tanmaxsharma</text>

</svg>
